openapi: 3.0.3
info:
  description: |-
    A relay API for AWS Cognito login/logout/token verification
    Implemented in Go 1.24.3.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Cognito Repeater API (Go)
  version: 1.0.0
paths:
  # System-level routing
  /:
    get:
      summary: Redirect to login
      description: |-
        Redirects the root path (/) to the login page.
        This endpoint is intended to be accessed via a web browser.
        It performs an HTTP redirect (status code 302) to /login.
      tags:
        - system
      responses:
        "302":
          description: Redirect to /login
          headers:
            Location:
              description: Target redirect URL
              schema:
                type: string
                example: https://cognito-repeater-go.com/login
  /health:
    get:
      summary: Health check endpoint
      description: |-
        A health check endpoint used by monitoring systems or load balancers
        to confirm that the server is running. Returns a simple "healthy" message.
      tags:
        - system
      responses:
        "200":
          description: healthy message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                statusOKExample:
                  summary: Health reply message
                  value:
                    status: healthy
  /error/404:
    get:
      summary: Simulate 404 Not Found
      description: |-
        Simulates a 404 Not Found response for testing or monitoring purposes.
        This can be used for uptime checks or CDN behavior testing.
      tags:
        - system
      responses:
        "404":
          description: Simulated 404 Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSimulationResponse"
              examples:
                simulatedNotFoundExample:
                  summary: Simulated not found response
                  value:
                    message: Simulated 404 Not Found

  # Auth-related endpoints
  /login:
    get:
      summary: Redirect to Cognito login
      description: |-
        Starts the OAuth2 login flow by redirecting the client to the Cognito authorization endpoint.
        This endpoint is designed to be used in a browser environment, as it performs an HTTP redirect (302)
        and includes a state parameter in the redirect URL to help prevent CSRF attacks.
      tags:
        - auth
      responses:
        "302":
          description: Redirect with Location header
          headers:
            Location:
              description: Cognito authorization endpoint URL
              schema:
                type: string
                example: >-
                  https://auth.cognito-repeater-go.com/oauth2/authorize?client_id=CLIENT_ID&response_type=code&scope=SCOPE&redirect_uri=REDIRECT_URI&state=STATE
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FailedToCreateRequest:
                  summary: Failed to create request
                  value:
                    error: failed to create request
                FailedToParseLoginURL:
                  summary: Failed to parse login URL
                  value:
                    error: failed to parse login url
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeMetadata:
                  summary: Failed to decode metadata
                  value:
                    error: failed to decode metadata
                ErrFailedToFetchMetadata:
                  summary: Failed to fetch metadata
                  value:
                    error: failed to fetch metadata
                ErrMissingAuthorizationEndpoint:
                  summary: Missing authorization_endpoint
                  value:
                    error: missing authorization_endpoint
                ErrUnexpectedMetadataStatusCode:
                  summary: Unexpected response from metadata
                  value:
                    error: unexpected response from metadata
  /logout:
    get:
      summary: Redirect to Cognito logout
      description: |-
        Logs the user out by redirecting to the Cognito end session endpoint.
        This endpoint is intended to be accessed via a web browser as it performs a redirect.

        Requires the token to be sent in the request URL as a query parameter.

        Example request URL (replace <ID_TOKEN> with actual JWT value):
          https://cognito-repeater-go.com/logout?id_token_hint=<ID_TOKEN>
      tags:
        - auth
      parameters:
        - name: id_token_hint
          in: query
          required: true
          description: ID token (JWT) to supply as id_token_hint
          schema:
            type: string
      responses:
        "302":
          description: Redirect with Location header
          headers:
            Location:
              description: Cognito logout endpoint URL
              schema:
                type: string
                example: >-
                  https://auth.cognito-repeater-go.com/logout?client_id=CLIENT_ID&logout_uri=LOGOUT_URI&id_token_hint=ID_TOKEN
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrMissingIDTokenHint:
                  summary: Missing id_token_hint in query
                  value:
                    error: missing id_token_hint in query
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToCreateRequest:
                  summary: Failed to create request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeMetadata:
                  summary: Failed to decode metadata
                  value:
                    error: failed to decode metadata
                ErrFailedToFetchMetadata:
                  summary: Failed to fetch metadata
                  value:
                    error: failed to fetch metadata
                ErrMissingEndSessionEndpoint:
                  summary: Missing authorization_endpoint
                  value:
                    error: missing end_session_endpoint
                ErrUnexpectedMetadataStatusCode:
                  summary: Unexpected response from metadata
                  value:
                    error: unexpected response from metadata
  /revoke:
    post:
      summary: Revoke refresh token
      description: |-
        Revokes the given refresh token by calling Cognito's revocation endpoint.
        This invalidates the token and prevents future use for refreshing sessions.
        Typically used during logout to invalidate the session.

        Requires the token to be sent in the request body as application/x-www-form-urlencoded.

        Example form body (replace <REFRESH_TOKEN> with actual token):
          token=<REFRESH_TOKEN>
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Refresh token to be revoked
            examples:
              sample:
                summary: Example form payload
                value:
                  token: <REFRESH_TOKEN>
      responses:
        "204":
          description: No Content
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToParseForm:
                  summary: Failed to parse form
                  value:
                    error: failed to parse form
                ErrMissingClientCredentials:
                  summary: Missing client credentials
                  value:
                    error: missing client credentials
                ErrMissingToken:
                  summary: Token is missing from body
                  value:
                    error: token is missing from body
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToCreateRequest:
                  summary: Failed to create request
                  value:
                    error: failed to create request
                ErrFailedToCreateRevokeRequest:
                  summary: Failed to create revoke request
                  value:
                    error: failed to create revoke request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeMetadata:
                  summary: Failed to decode metadata
                  value:
                    error: failed to decode metadata
                ErrFailedToFetchMetadata:
                  summary: Failed to fetch metadata
                  value:
                    error: failed to fetch metadata
                ErrFailedToSendRevokeRequest :
                  summary: Failed to send revoke request
                  value:
                    error: failed to send revoke request
                ErrMissingRevocationEndpoint:
                  summary: Missing revocation_endpoint
                  value:
                    error: missing revocation_endpoint
                ErrUnexpectedRevokeStatusCode:
                  summary: Unexpected response from revoke
                  value:
                    error: unexpected response from revoke
                ErrUnexpectedMetadataStatusCode:
                  summary: Unexpected response from metadata
                  value:
                    error: unexpected response from metadata

  # User-related endpoints
  /me:
    get:
      summary: Verify ID token and return user info
      description: |-
        Verifies the validity of an ID token by validating its signature using Cognito's JWK Set.
        Includes checks for standard claims such as `iss`, `aud`, and `exp`.
        Returns the `sub` claim if verification succeeds.

        Requires a Bearer token in the Authorization header.

        Example header (replace <ID_TOKEN> with actual token):
          Authorization: Bearer <ID_TOKEN>
      tags:
        - user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Returns user sub claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              examples:
                statusOKExample:
                  summary: User sub claim
                  value:
                    sub: "12345678-aaaa-bbbb-cccc-1234567890ab"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeJWTHeader:
                  summary: Failed to decode JWT header
                  value:
                    error: failed to decode JWT header
                ErrFailedToParseJWTHeader:
                  summary: Failed to parse JWT header
                  value:
                    error: failed to parse JWT header
                ErrInvalidAuthorizationHeaderFormat:
                  summary: Invalid authorization header format
                  value:
                    error: invalid authorization header format
                ErrInvalidJWTFormat:
                  summary: Invalid JWT format
                  value:
                    error: invalid JWT format
                ErrInvalidSigningAlg:
                  summary: Unexpected signing method
                  value:
                    error: unexpected signing method
                ErrMissingKID:
                  summary: Kid not found in JWT header
                  value:
                    error: kid not found in JWT header
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrInvalidAudience:
                  summary: Invalid audience
                  value:
                    error: invalid audience
                ErrInvalidIssuer:
                  summary: Unexpected issuer
                  value:
                    error: unexpected issuer
                ErrKIDNotFoundInJWKSet:
                  summary: Kid not found in JWK set
                  value:
                    error: kid not found in JWK set
                ErrMissingAudience:
                  summary: Audience claim is missing
                  value:
                    error: audience claim is missing
                ErrMissingAuthorizationHeader:
                  summary: Missing authorization header
                  value:
                    error: missing authorization header
                ErrMissingSubject:
                  summary: Missing subject (sub)
                  value:
                    error: missing subject (sub)
                ErrTokenExpired:
                  summary: token is expired
                  value:
                    error: token is expired
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrExponentTooLarge:
                  summary: Exponent too large to fit in int
                  value:
                    error: exponent too large to fit in int
                ErrFailedToCreateJWKSetRequest:
                  summary: Failed to create jwks request
                  value:
                    error: failed to create jwks request
                ErrFailedToCreateRequest:
                  summary: Failed to create request
                  value:
                    error: failed to create request
                ErrFailedToWriteUserResponse:
                  summary: Failed to write user response
                  value:
                    error: failed to write user response
                ErrInvalidE:
                  summary: Invalid e (exponent)
                  value:
                    error: invalid e (exponent)
                ErrInvalidExponent:
                  summary: Invalid exponent value
                  value:
                    error: invalid exponent value
                ErrInvalidN:
                  summary: Invalid n (modulus)
                  value:
                    error: invalid n (modulus)
                ErrJWKSetNil:
                  summary: JWKSet is nil
                  value:
                    error: JWKSet is nil
                ErrJWTParseFailed:
                  summary: Failed to parse JWT
                  value:
                    error: failed to parse JWT
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeJWKSet:
                  summary: Failed to decode jwks JSON
                  value:
                    error: failed to decode jwks JSON
                ErrFailedToDecodeMetadata:
                  summary: Failed to decode metadata
                  value:
                    error: failed to decode metadata
                ErrFailedToFetchJWKSet:
                  summary: Failed to fetch jwks
                  value:
                    error: failed to fetch jwks
                ErrFailedToFetchMetadata:
                  summary: Failed to fetch metadata
                  value:
                    error: failed to fetch metadata
                ErrInvalidBase64URL:
                  summary: Invalid base64url encoding
                  value:
                    error: invalid base64url encoding
                ErrMissingJWKSURI:
                  summary: Missing jwks_uri
                  value:
                    error: missing jwks_uri
                ErrUnexpectedMetadataStatusCode:
                  summary: Unexpected response from metadata
                  value:
                    error: unexpected response from metadata
  /whoami:
    get:
      summary: Verify access token using Cognito UserInfo endpoint
      description: |-
        Verifies the validity of an access token by querying the Cognito UserInfo endpoint.
        Confirms that the session is active and the token is still valid.
        Returns user information, including the `sub` claim, if verification succeeds.

        Requires a Bearer token in the Authorization header.

        Example header:
          Authorization: Bearer <ACCESS_TOKEN>
      tags:
        - user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User info from Cognito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
              examples:
                statusOKExample:
                  summary: User info from Cognito
                  value:
                    sub: "12345678-aaaa-bbbb-cccc-1234567890ab"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrInvalidAuthorizationHeaderFormat:
                  summary: Invalid authorization header format
                  value:
                    error: invalid authorization header format
                ErrMissingSubject:
                  summary: missing subject (sub)
                  value:
                    error: missing subject (sub)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrMissingAuthorizationHeader:
                  summary: Missing authorization header
                  value:
                    error: missing authorization header
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToCreateRequest:
                  summary: Failed to create request
                  value:
                    error: failed to create request
                ErrFailedToCreateUserinfoRequest:
                  summary: Failed to create userinfo request
                  value:
                    error: failed to create userinfo request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrFailedToDecodeMetadata:
                  summary: Failed to decode metadata
                  value:
                    error: failed to decode metadata
                ErrFailedToFetchMetadata:
                  summary: Failed to fetch metadata
                  value:
                    error: failed to fetch metadata
                ErrFailedToFetchUserinfoRequest:
                  summary: Failed to fetch userinfo request
                  value:
                    error: failed to fetch userinfo request
                ErrFailedToParseUserinfoResponse:
                  summary: Failed to parse userinfo response
                  value:
                    error: failed to parse userinfo response
                ErrFailedToReadMetadataResponse:
                  summary: Failed to read metadata response body
                  value:
                    error: failed to read metadata response body
                ErrFailedToReadUserinfoResponse:
                  summary: Failed to read userinfo response body
                  value:
                    error: failed to read userinfo response body
                ErrMissingUserinfoEndpoint:
                  summary: Missing userinfo_endpoint
                  value:
                    error: missing userinfo_endpoint
                ErrUnexpectedMetadataStatusCode:
                  summary: Unexpected response from metadata
                  value:
                    error: unexpected response from metadata
                ErrUnexpectedUserinfoStatusCode:
                  summary: Unexpected response from userinfo
                  value:
                    error: unexpected response from userinfo

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      description: Standard error response schema
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error message

    HealthResponse:
      type: object
      description: Health check response schema
      required:
        - status
      properties:
        status:
          type: string
          description: Health reply message

    ErrorSimulationResponse:
      type: object
      description: Simulated 404 response used for testing
      required:
        - message
      properties:
        message:
          type: string
          description: Description of the simulated 404 error

    UserResponse:
      type: object
      description: Response containing the subject (`sub`) from the ID token
      required:
        - sub
      properties:
        sub:
          type: string
          description: Unique identifier of the user

    UserInfoResponse:
      type: object
      description: Response containing the subject (`sub`) from the access token
      required:
        - sub
      properties:
        sub:
          type: string
          description: Unique identifier of the user

servers:
  - url: https://cognito-repeater-go.com
    description: Production server

tags:
  - name: system
    description: System-level endpoints such as health checks and redirects
  - name: auth
    description: Authentication-related endpoints including login, logout, and token revocation
  - name: user
    description: Endpoints related to user identity and token validation
