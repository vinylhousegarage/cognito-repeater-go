openapi: 3.0.0
info:
  description: |-
    A relay API for AWS Cognito login/logout/token verification
    Implemented in Go 1.24.3.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Cognito Repeater API (Go)
  version: 1.0.0
paths:
  # System-level routing
  /:
    get:
      summary: Redirect to login
      description: |-
        Redirects the root path (/) to the login page.
        This endpoint is intended to be accessed via a web browser.
        It performs an HTTP redirect (status code 302) to /login.
      tags:
        - system
      responses:
        "302":
          description: Redirect to /login
          headers:
            Location:
              description: Target redirect URL
              schema:
                type: string
                example: https://cognito-repeater-go.com/login
  /health:
    get:
      summary: Health check endpoint
      description: |-
        A health check endpoint used by monitoring systems or load balancers
        to confirm that the server is running. Returns a simple "healthy" message.
      tags:
        - system
      responses:
        "200":
          description: healthy message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                statusOKExample:
                  summary: Health reply message
                  value:
                    status: healthy
  /error/404:
    get:
      summary: Simulate 404 Not Found
      description: |-
        Simulates a 404 Not Found response for testing or monitoring purposes.
        This can be used for uptime checks or CDN behavior testing.
      tags:
        - system
      responses:
        "404":
          description: Simulated 404 Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSimulationResponse"
              examples:
                simulatedNotFoundExample:
                  summary: Simulated not found response
                  value:
                    message: Simulated 404 Not Found

  # Auth-related endpoints
  /login:
    get:
      summary: Redirect to Cognito login
      description: |-
        Starts the OAuth2 login flow by redirecting the client to the Cognito authorization endpoint.
        This endpoint is designed to be used in a browser environment, as it performs an HTTP redirect (302)
        and includes a state parameter in the redirect URL to help prevent CSRF attacks.
      tags:
        - auth
      responses:
        "302":
          description: Redirect with Location header
          headers:
            Location:
              description: Cognito authorization endpoint URL
              schema:
                type: string
                example: >-
                  https://ap-northeast-1phkt8hi3t.auth.ap-northeast-1.amazoncognito.com/oauth2/authorize?client_id=CLIENT_ID&response_type=code&scope=SCOPE&redirect_uri=REDIRECT_URI&state=STATE
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerErrorExample:
                  summary: Failed to create internal request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badGatewayExample:
                  summary: Failed to fetch Cognito metadata endpoint
                  value:
                    error: failed to fetch metadata
  /logout:
    get:
      summary: Redirect to Cognito logout
      description: |-
        Logs the user out by redirecting to the Cognito end session endpoint.
        This endpoint is intended to be accessed via a web browser as it performs a redirect.
      tags:
        - auth
      parameters:
        - name: id_token_hint
          in: query
          required: true
          description: ID token (JWT) to supply as id_token_hint
          schema:
            type: string
      responses:
        "302":
          description: Redirect with Location header
          headers:
            Location:
              description: Cognito logout endpoint URL
              schema:
                type: string
                example: >-
                  https://ap-northeast-1phkt8hi3t.auth.ap-northeast-1.amazoncognito.com/logout?client_id=CLIENT_ID&logout_uri=LOGOUT_URI&id_token_hint=ID_TOKEN
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequestExample:
                  summary: Missing ID token
                  value:
                    error: missing id_token_hint in query
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerErrorExample:
                  summary: Failed to create internal request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badGatewayExample:
                  summary: Metadata fetch failure
                  value:
                    error: failed to fetch metadata
  /revoke:
    post:
      summary: Revoke refresh token
      description: |-
        Revokes the given refresh token by calling Cognito's revocation endpoint.
        This invalidates the token and prevents future use for refreshing sessions.
        Typically used during logout to invalidate the session.

        Requires the token to be sent in the request body as application/x-www-form-urlencoded.

        Example form body:
          token=REFRESH_TOKEN_VALUE
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Refresh token to be revoked
            examples:
              sample:
                summary: Example form payload
                value:
                  token: REFRESH_TOKEN_VALUE
      responses:
        "204":
          description: No Content
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequestExample:
                  summary: Client credentials not provided
                  value:
                    error: missing client credentials
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerErrorExample:
                  summary: Failed to create internal request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badGatewayExample:
                  summary: Metadata fetch failure
                  value:
                    error: failed to fetch metadata

  # User-related endpoints
  /me:
    get:
      summary: Verify ID token and return user info
      description: |-
        Verifies the validity of an ID token by validating its signature using Cognito's JWK Set.
        Includes checks for standard claims such as `iss`, `aud`, and `exp`.
        Returns the `sub` claim if verification succeeds.

        Requires a Bearer token in the Authorization header.

        Example header:
          Authorization: Bearer ID_TOKEN_VALUE
      tags:
        - user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Returns user sub claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              examples:
                statusOKExample:
                  summary: User sub claim
                  value:
                    sub: "12345678-aaaa-bbbb-cccc-1234567890ab"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequestExample:
                  summary: Client credentials not provided
                  value:
                    error: missing client credentials
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorizedExample:
                  summary: Unauthorized - Token is expired
                  value:
                    error: token is expired
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerErrorExample:
                  summary: Failed to create internal request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badGatewayExample:
                  summary: Metadata fetch failure
                  value:
                    error: failed to fetch metadata
  /whoami:
    get:
      summary: Verify access token using Cognito UserInfo endpoint
      description: |-
        Verifies the validity of an access token by querying the Cognito UserInfo endpoint.
        Confirms that the session is active and the token is still valid.
        Returns user information, including the `sub` claim, if verification succeeds.

        Requires a Bearer token in the Authorization header.

        Example header:
          Authorization: Bearer ACCESS_TOKEN_VALUE
      tags:
        - user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User info from Cognito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
              examples:
                statusOKExample:
                  summary: User info from Cognito
                  value:
                    sub: "12345678-aaaa-bbbb-cccc-1234567890ab"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequestExample:
                  summary: Client credentials not provided
                  value:
                    error: missing client credentials
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorizedExample:
                  summary: Unauthorized - Token is expired
                  value:
                    error: token is expired
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerErrorExample:
                  summary: Failed to create internal request
                  value:
                    error: failed to create request
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badGatewayExample:
                  summary: Metadata fetch failure
                  value:
                    error: failed to fetch metadata

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      description: Standard error response schema
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error message

    HealthResponse:
      type: object
      description: Health check response schema
      required:
        - status
      properties:
        status:
          type: string
          description: Health reply message

    ErrorSimulationResponse:
      type: object
      description: Simulated 404 response used for testing
      required:
        - message
      properties:
        message:
          type: string
          description: Description of the simulated 404 error

    UserResponse:
      type: object
      description: Response containing the subject (`sub`) from the ID token
      required:
        - sub
      properties:
        sub:
          type: string
          description: Unique identifier of the user

    UserInfoResponse:
      type: object
      description: Response containing the subject (`sub`) from the access token
      required:
        - sub
      properties:
        sub:
          type: string
          description: Unique identifier of the user

servers:
  - url: https://cognito-repeater-go.com
    description: Production server

tags:
  - name: system
    description: System-level endpoints such as health checks and redirects
  - name: auth
    description: Authentication-related endpoints including login, logout, and token revocation
  - name: user
    description: Endpoints related to user identity and token validation
