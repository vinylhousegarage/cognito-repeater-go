name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy:
              - 'Dockerfile.prod'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/cd.yml'
              - '!README.md'
              - '!docs/index.md'

      - name: Skip deployment if only docs changed
        if: steps.changes.outputs.deploy != 'true'
        run: echo "Only docs changed. Skipping deployment." && exit 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t cognito-repeater-go:prod -f Dockerfile.prod .

      - name: Tag image with commit SHA
        run: |
          docker tag cognito-repeater-go:prod ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cognito-repeater-go:main-${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cognito-repeater-go:main-${{ github.sha }}

      - name: Update Lambda function code safely
        run: |
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cognito-repeater-go:main-${{ github.sha }}"
          aws lambda update-function-code \
            --function-name cognito-repeater-go \
            --image-uri "$IMAGE_URI" \
          | jq 'del(.Environment.Variables)'
